services:

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: thyrotrack-backend
    restart: unless-stopped
    env_file:
      - ./backend/.env
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      DATABASE_URL: postgresql://thyrotrack_app:${DB_PASSWORD}@host.docker.internal:5432/thyrotrack
      NODE_ENV: production
      PORT: 3001
      # Frontend et API partagent la même origine via Nginx (le navigateur
      # parle uniquement à nginx sur le port public). CORS_ORIGIN reste un
      # garde-fou si jamais le backend est appelé directement.
      FRONTEND_URL: http://caesura:8082,https://thyrotrack.alithiel31.dev
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:3001/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    networks:
      - thyrotrack-network

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: thyrotrack-frontend
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - thyrotrack-network
      - traefik-net
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.thyrotrack.rule=Host(`thyrotrack.alithiel31.dev`)"
      - "traefik.http.routers.thyrotrack.entrypoints=web"
      - "traefik.http.services.thyrotrack.loadbalancer.server.port=80"

networks:
  thyrotrack-network:
    driver: bridge
    ipam:
      config:
        - subnet: 172.22.0.0/24
  traefik-net:
    external: true
