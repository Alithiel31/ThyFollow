# Images publiées par la CI (job `publish`) pour linux/arm64. IMAGE_TAG choisit
# la version : sha-<commit> (immuable, posé par deploy.sh) ou main (dernière
# version de main). Pour construire localement à la place :
#   docker compose -f docker-compose.yml -f docker-compose.build.yml up -d --build
x-database-url: &database-url postgresql://thyrotrack_app:${DB_PASSWORD}@host.docker.internal:5432/thyrotrack

services:

  # Applique les migrations Prisma puis s'arrête. Le backend n'est (re)créé que
  # si elle réussit : une migration en échec laisse l'ancienne version en ligne.
  migrate:
    image: ghcr.io/alithiel31/thyfollow-backend:${IMAGE_TAG:-main}
    container_name: thyrotrack-migrate
    command: ["npx", "prisma", "migrate", "deploy"]
    restart: "no"
    labels:
      - "homelab.tier=app"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      DATABASE_URL: *database-url
    networks:
      - thyrotrack-network

  backend:
    image: ghcr.io/alithiel31/thyfollow-backend:${IMAGE_TAG:-main}
    container_name: thyrotrack-backend
    restart: unless-stopped
    labels:
      - "homelab.tier=app"
    env_file:
      - ./backend/.env
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      DATABASE_URL: *database-url
      NODE_ENV: production
      PORT: 3001
      # Frontend et API partagent la même origine via Nginx (le navigateur
      # parle uniquement à nginx sur le port public). CORS_ORIGIN reste un
      # garde-fou si jamais le backend est appelé directement.
      FRONTEND_URL: http://caesura:8082,https://thyrotrack.alithiel31.dev
      # Import de bilans PDF. En production, ces valeurs sont injectées par
      # Infisical (voir deploy.sh) ; ailleurs, elles viennent du .env racine.
      # Absentes, l'import répond 501 et le repli IA est désactivé.
      PDF_ENCRYPTION_KEY: ${PDF_ENCRYPTION_KEY:-}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      # Abonnement Pro (Stripe). Absents, le paiement répond 501 ; les codes
      # promo fonctionnent sans Stripe.
      STRIPE_SECRET_KEY: ${STRIPE_SECRET_KEY:-}
      STRIPE_WEBHOOK_SECRET: ${STRIPE_WEBHOOK_SECRET:-}
      STRIPE_PRICE_ID: ${STRIPE_PRICE_ID:-}
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:3001/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    depends_on:
      migrate:
        condition: service_completed_successfully
    networks:
      - thyrotrack-network

  frontend:
    image: ghcr.io/alithiel31/thyfollow-frontend:${IMAGE_TAG:-main}
    container_name: thyrotrack-frontend
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - thyrotrack-network
      - traefik-net
    labels:
      - "homelab.tier=app"
      - "traefik.enable=true"
      - "traefik.http.routers.thyrotrack.rule=Host(`thyrotrack.alithiel31.dev`)"
      - "traefik.http.routers.thyrotrack.entrypoints=web"
      - "traefik.http.services.thyrotrack.loadbalancer.server.port=80"

networks:
  thyrotrack-network:
    driver: bridge
    ipam:
      config:
        - subnet: 172.22.0.0/24
  traefik-net:
    external: true
