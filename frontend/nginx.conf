server {
    listen 80;

    root /usr/share/nginx/html;
    index index.html;

    # ── Sécurité : en-têtes HTTP standards (équivalent helmet côté SPA,
    # nécessaire car helmet() côté backend ne couvre que /api/*)
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "geolocation=(), camera=(), microphone=(), payment=(), usb=()" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data:; connect-src 'self'; manifest-src 'self'; worker-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;

    # API : tout /api/* part vers le backend
    location /api/ {
        proxy_pass http://backend:3001/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Health check du backend, exposé tel quel (hors /api)
    location = /health {
        proxy_pass http://backend:3001/health;
    }

    # SPA : toute route inconnue (/dashboard, /log/2026-07-03...) retombe
    # sur index.html, React Router prend le relais côté client.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
