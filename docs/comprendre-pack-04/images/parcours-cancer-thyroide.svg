<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" role="img" aria-labelledby="title desc">
  <title id="title">Parcours de soins après la découverte d’un nodule thyroïdien</title>
  <desc id="desc">Quatre étapes possibles : découverte, bilan, échange avec l’équipe et plan adapté. Un nodule ne signifie pas automatiquement un cancer.</desc>
  <rect width="800" height="500" rx="32" fill="#f4fbfa"/>
  <text x="56" y="64" font-family="Arial,sans-serif" font-size="21" font-weight="700" fill="#267c74">UN PARCOURS ADAPTÉ À CHAQUE SITUATION</text>
  <path d="M145 224H653" stroke="#a9ddd5" stroke-width="10" stroke-linecap="round"/>
  <g font-family="Arial,sans-serif" text-anchor="middle">
    <circle cx="144" cy="224" r="60" fill="#fff" stroke="#8ccfc5" stroke-width="5"/>
    <circle cx="144" cy="214" r="16" fill="#d9f4ef" stroke="#2b9d8f" stroke-width="4"/><path d="M114 250c4-23 56-23 60 0" fill="none" stroke="#2b9d8f" stroke-width="5" stroke-linecap="round"/>
    <text x="144" y="321" font-size="20" font-weight="700" fill="#344054">Découverte</text><text x="144" y="349" font-size="16" fill="#667085">d’un nodule</text>
    <circle cx="314" cy="224" r="60" fill="#fff" stroke="#8ccfc5" stroke-width="5"/>
    <rect x="292" y="194" width="44" height="58" rx="6" fill="#e5e1ff" stroke="#6875b8" stroke-width="4"/><path d="M302 210h24M302 222h24M302 234h18" stroke="#6875b8" stroke-width="4" stroke-linecap="round"/>
    <text x="314" y="321" font-size="20" font-weight="700" fill="#344054">Bilan</text><text x="314" y="349" font-size="16" fill="#667085">si nécessaire</text>
    <circle cx="484" cy="224" r="60" fill="#fff" stroke="#8ccfc5" stroke-width="5"/>
    <path d="M457 224c12-17 42-17 54 0-12 17-42 17-54 0z" fill="#e5e1ff" stroke="#6875b8" stroke-width="4"/><circle cx="484" cy="224" r="8" fill="#6875b8"/>
    <text x="484" y="321" font-size="20" font-weight="700" fill="#344054">Explication</text><text x="484" y="349" font-size="16" fill="#667085">des résultats</text>
    <circle cx="654" cy="224" r="60" fill="#fff" stroke="#8ccfc5" stroke-width="5"/>
    <path d="M629 224l17 17 34-37" fill="none" stroke="#2b9d8f" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="654" y="321" font-size="20" font-weight="700" fill="#344054">Suite adaptée</text><text x="654" y="349" font-size="16" fill="#667085">avec l’équipe</text>
  </g>
  <rect x="74" y="391" width="652" height="58" rx="20" fill="#fff" stroke="#d9e9e6" stroke-width="2"/>
  <text x="400" y="427" text-anchor="middle" font-family="Arial,sans-serif" font-size="18" font-weight="700" fill="#267c74">Un nodule ne signifie pas automatiquement un cancer.</text>
</svg>
