<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" role="img" aria-labelledby="title desc">
  <title id="title">Options de prise en charge de la maladie de Basedow</title>
  <desc id="desc">Trois options à discuter avec l’équipe médicale : traitement médicamenteux, iode radioactif et chirurgie. Le choix dépend de chaque situation.</desc>
  <rect width="800" height="500" rx="32" fill="#f7f6ff"/>
  <text x="400" y="60" text-anchor="middle" font-family="Arial,sans-serif" font-size="22" font-weight="700" fill="#4f46a5">DÉCIDER AVEC L’ÉQUIPE MÉDICALE</text>
  <rect x="263" y="92" width="274" height="82" rx="24" fill="#fff" stroke="#c9c4ef" stroke-width="3"/>
  <circle cx="306" cy="132" r="22" fill="#e5e1ff"/><path d="M296 132h20M306 122v20" stroke="#6875b8" stroke-width="5" stroke-linecap="round"/>
  <text x="420" y="127" text-anchor="middle" font-family="Arial,sans-serif" font-size="18" font-weight="700" fill="#344054">Votre situation</text><text x="420" y="151" text-anchor="middle" font-family="Arial,sans-serif" font-size="15" fill="#667085">et vos préférences</text>
  <path d="M400 174v30M143 204h514M143 204v28M400 204v28M657 204v28" fill="none" stroke="#aaa5d8" stroke-width="4"/>
  <g font-family="Arial,sans-serif" text-anchor="middle">
    <rect x="48" y="232" width="190" height="137" rx="22" fill="#fff" stroke="#c9c4ef" stroke-width="3"/>
    <rect x="119" y="254" width="48" height="24" rx="12" fill="#d9f4ef" transform="rotate(-28 143 266)"/><path d="M128 280l30 16" stroke="#2b9d8f" stroke-width="6" stroke-linecap="round"/>
    <text x="143" y="324" font-size="18" font-weight="700" fill="#344054">Médicaments</text><text x="143" y="349" font-size="14" fill="#667085">antithyroïdiens</text>
    <rect x="305" y="232" width="190" height="137" rx="22" fill="#fff" stroke="#c9c4ef" stroke-width="3"/>
    <circle cx="400" cy="271" r="24" fill="#fce8c8"/><path d="M400 250v42M379 271h42" stroke="#d49436" stroke-width="4" stroke-linecap="round"/>
    <text x="400" y="324" font-size="18" font-weight="700" fill="#344054">Iode radioactif</text><text x="400" y="349" font-size="14" fill="#667085">irathérapie</text>
    <rect x="562" y="232" width="190" height="137" rx="22" fill="#fff" stroke="#c9c4ef" stroke-width="3"/>
    <path d="M636 257h40v16h-40zM642 273v26h28v-26" fill="#e5e1ff" stroke="#6875b8" stroke-width="4" stroke-linejoin="round"/>
    <text x="657" y="324" font-size="18" font-weight="700" fill="#344054">Chirurgie</text><text x="657" y="349" font-size="14" fill="#667085">intervention</text>
  </g>
  <rect x="103" y="405" width="594" height="51" rx="25" fill="#e8e6fa"/>
  <text x="400" y="437" text-anchor="middle" font-family="Arial,sans-serif" font-size="17" font-weight="700" fill="#4f46a5">Aucune option ne convient à tout le monde.</text>
</svg>
