name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  # Sur main, chaque merge doit aller jusqu'à la publication de ses images :
  # on n'annule que les runs de PR rendus obsolètes par un nouveau push.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  backend:
    name: Backend (lint, typecheck, test)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - run: npm ci

      # qpdf : requis par les tests de lib/pdfDecrypt (fabrication de PDF protégés)
      - run: sudo apt-get update && sudo apt-get install -y qpdf

      - run: npm run lint

      - name: Typecheck + build
        run: npm run build

      - run: npm test

  frontend:
    name: Frontend (lint, typecheck, build)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - run: npm ci

      - run: npm run lint

      - name: Typecheck + build
        run: npm run build

      - run: npm test

  docker:
    name: Docker build (${{ matrix.service }})
    # Runner ARM natif : on valide l'image arm64 qui tournera sur le Pi,
    # et le cache GHA qu'elle remplit sert ensuite au job `publish`.
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        service: [backend, frontend]
    steps:
      - uses: actions/checkout@v7

      - uses: docker/setup-buildx-action@v4

      # Build uniquement (pas de push) : détecte une image cassée avant le merge.
      - uses: docker/build-push-action@v7
        with:
          context: ./${{ matrix.service }}
          push: false
          cache-from: type=gha,scope=${{ matrix.service }}
          cache-to: type=gha,mode=max,scope=${{ matrix.service }}

  migrations:
    name: Migrations (Prisma / PostgreSQL)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: backend
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/thyrotrack_ci
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: thyrotrack_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - run: npm ci

      # Rejoue toutes les migrations sur une base vierge.
      - name: Apply migrations
        run: npx prisma migrate deploy

      # Échoue (code 2) si schema.prisma contient des changements sans migration.
      - name: Check schema drift
        run: npx prisma migrate diff --from-url "$DATABASE_URL" --to-schema-datamodel prisma/schema.prisma --exit-code

  audit:
    name: Audit (${{ matrix.service }})
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        service: [backend, frontend]
    defaults:
      run:
        working-directory: ${{ matrix.service }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc

      # Dépendances de production uniquement, échec à partir de "high".
      - run: npm audit --omit=dev --audit-level=high

  # Publie les images arm64 sur GHCR après un merge sur main, une fois les
  # vérifications passées. `audit` n'est pas bloquant ici : une nouvelle
  # alerte sur une dépendance ne doit pas empêcher de publier son correctif.
  publish:
    name: Publish image (${{ matrix.service }})
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [backend, frontend, docker, migrations]
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 15
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        service: [backend, frontend]
    steps:
      - uses: actions/checkout@v7

      - uses: docker/setup-buildx-action@v4

      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # sha-<7 caractères> : version immuable, celle qu'on déploie.
      # main : dernière version publiée de main.
      - id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/alithiel31/thyfollow-${{ matrix.service }}
          tags: |
            type=sha,prefix=sha-,format=short
            type=raw,value=main

      - uses: docker/build-push-action@v7
        with:
          context: ./${{ matrix.service }}
          platforms: linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.service }}
          cache-to: type=gha,mode=max,scope=${{ matrix.service }}
